name: Auto Extract & Setup Xaxino for Railway

on:
  workflow_dispatch:
    inputs:
      gdrive_link:
        description: 'Apna Google Drive Share Link dalein'
        required: true
        default: 'PASTE_YOUR_GOOGLE_DRIVE_LINK_HERE'

permissions:
  contents: write

jobs:
  extract-and-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python gdown & Tools
        run: |
          pip install -U gdown
          sudo apt-get update && sudo apt-get install -y unzip rsync file p7zip-full

      - name: Download ZIP from Google Drive
        run: |
          RAW_URL="${{ github.event.inputs.gdrive_link }}"
          
          # URL mein se automatic Google Drive File ID extract karega
          if [[ "$RAW_URL" =~ /d/([a-zA-Z0-9_-]+) ]]; then
            FILE_ID="${BASH_REMATCH[1]}"
            echo "Extracted File ID from URL"
            gdown "$FILE_ID" -O xaxino.zip
          else
            CLEAN_URL=$(echo "$RAW_URL" | sed 's/^Https:/https:/g')
            gdown "$CLEAN_URL" -O xaxino.zip
          fi

          # Check file size & type
          ls -lh xaxino.zip
          FILE_TYPE=$(file -b --mime-type xaxino.zip)
          echo "Downloaded file MIME type: $FILE_TYPE"

          if [ "$FILE_TYPE" = "text/html" ]; then
            echo "❌ ERROR: ZIP ki jagah HTML page download hua hai! Google Drive mein file access ko 'Anyone with the link' par set karein."
            exit 1
          fi

      - name: Extract ZIP & Organize Files for Railway
        run: |
          mkdir -p temp_extract
          7z x xaxino.zip -otemp_extract -y

          # Find where 'core' is located inside extracted folders
          CORE_DIR=$(find temp_extract -type d -name "core" | head -n 1)
          if [ -z "$CORE_DIR" ]; then
            echo "Checking for nested zip inside archive..."
            NESTED_ZIP=$(find temp_extract -name "*.zip" | head -n 1)
            if [ -n "$NESTED_ZIP" ]; then
              mkdir -p temp_extract/nested
              7z x "$NESTED_ZIP" -otemp_extract/nested -y
              CORE_DIR=$(find temp_extract/nested -type d -name "core" | head -n 1)
            fi
          fi

          if [ -z "$CORE_DIR" ]; then
            echo "❌ ERROR: 'core' folder archive ke andar nahi mila!"
            ls -la temp_extract
            exit 1
          fi

          PARENT_DIR=$(dirname "$CORE_DIR")
          echo "Found main project files in: $PARENT_DIR"

          # Copy all main files (assets, core, index.php, etc.) to repo root
          rsync -a "$PARENT_DIR/" ./

          # Find the .sql database file and place it in root as database.sql
          SQL_FILE=$(find temp_extract -name "*.sql" | head -n 1)
          if [ -n "$SQL_FILE" ]; then
            cp "$SQL_FILE" ./database.sql
            echo "Copied SQL file to ./database.sql"
          fi

          # Clean up temporary files and any leftover >95MB files (GitHub limit protection)
          rm -rf temp_extract xaxino.zip
          find . -path ./.git -prune -o -type f -size +95M -exec rm -f {} +

          # Remove .gitignore inside subfolders so vendor packages push to GitHub
          find . -mindepth 2 -name ".gitignore" -delete
          rm -f .gitignore

      - name: Patch HTTPS & Create Startup + Dockerfile
        run: |
          cat << 'EOF' > start.sh
          #!/bin/bash
          PORT=${PORT:-8080}
          sed -i "s/80/$PORT/g" /etc/apache2/sites-available/000-default.conf /etc/apache2/ports.conf

          if [ ! -f /var/www/html/core/.env ]; then
            cp /var/www/html/core/.env.example /var/www/html/core/.env 2>/dev/null || touch /var/www/html/core/.env
          fi

          if [ -f /var/www/html/database.sql ] && [ -n "$DB_HOST" ]; then
            echo "Checking MySQL database tables..."
            TABLE_COUNT=$(mysql -h"$DB_HOST" -P"${DB_PORT:-3306}" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" -N -e "SHOW TABLES;" 2>/dev/null | wc -l)
            if [ "$TABLE_COUNT" -eq "0" ]; then
              echo "Empty database detected! Importing database.sql..."
              mysql -h"$DB_HOST" -P"${DB_PORT:-3306}" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" < /var/www/html/database.sql
              echo "Database imported successfully!"
            fi
          fi

          chown -R www-data:www-data /var/www/html/core/storage /var/www/html/core/bootstrap/cache
          chmod -R 775 /var/www/html/core/storage /var/www/html/core/bootstrap/cache

          apache2-foreground
          EOF
          chmod +x start.sh

          cat << 'EOF' > Dockerfile
          FROM php:8.2-apache

          RUN apt-get update && apt-get install -y \
              libpng-dev libjpeg-dev libfreetype6-dev libzip-dev \
              libicu-dev libonig-dev libxml2-dev zip unzip curl default-mysql-client \
              && docker-php-ext-configure gd --with-freetype --with-jpeg \
              && docker-php-ext-install pdo_mysql mysqli mbstring exif pcntl bcmath gd zip intl soap

          RUN a2enmod rewrite

          WORKDIR /var/www/html
          COPY . /var/www/html

          RUN chown -R www-data:www-data /var/www/html \
              && chmod -R 775 /var/www/html/core/storage \
              && chmod -R 775 /var/www/html/core/bootstrap/cache \
              && chmod +x /var/www/html/start.sh

          CMD ["/var/www/html/start.sh"]
          EOF

      - name: Commit and Push Extracted Files to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-extracted Xaxino 3.8 + Railway Docker Setup" || echo "No changes to commit"
          git push
